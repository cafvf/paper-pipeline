[build-system]
requires = ["setuptools>=61.0","wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-pipeline"
version = "0.1.0"
description = "Paper ingestion and LLM assessment pipeline extracted from ChrisVault4.0"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "pyyaml>=6.0",
  "pydantic>=2.0",
  "requests>=2.28",
  "rich>=12.0",
  "pymupdf>=1.22",
  "pypdf>=3.0",
]

[project.scripts]
paper-pipeline = "cli:main"
