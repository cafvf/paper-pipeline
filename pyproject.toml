[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "paper-triage"
version = "0.1.0"
description = "Deterministic, local-first paper triage domain"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7,<3"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["paper_triage"]
# Production code is type-checked strictly; tests are behavioral fixtures and
# are checked by pytest and Ruff rather than being an implicit second API.
exclude = "^tests/"

[tool.hatch.build.targets.wheel]
packages = ["src/paper_triage"]
