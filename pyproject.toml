[build-system]
requires = ["setuptools>=61.0","wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-pipeline"
version = "0.1.0"
description = "Standalone paper ingestion and LLM assessment pipeline"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "pyyaml>=6.0",
  "pydantic>=2.0",
  "requests>=2.28",
  "rich>=12.0",
  "pymupdf>=1.22",
  "pypdf>=3.0",
  "jsonschema>=4.0",
  "pre-commit>=4.6.0",
  "pytest>=9.0.3",
  "ruff>=0.15.12",
  "black>=26.3.1",
  "bandit>=1.7.5",
  "safety>=2.3.0",
]

[project.scripts]
paper-pipeline = "paper_pipeline.cli:main"
