title = "gitleaks config for paper-pipeline"

[[rules]]
id = "zotero-api-key"
description = "Zotero API key assigned in env/config files"
regex = '''(?i)(ZOTERO_API_KEY|zotero[_-]?api[_-]?key|api_key)\s*[:=]\s*["']?([A-Za-z0-9]{20,})["']?'''
secretGroup = 2
keywords = ["ZOTERO_API_KEY", "zotero_api_key", "api_key"]

[[rules]]
id = "zotero-user-id"
description = "Zotero numeric user id assigned in env/config files"
regex = '''(?i)(ZOTERO_USER_ID|zotero[_-]?user[_-]?id|user_id)\s*[:=]\s*["']?([0-9]{4,})["']?'''
secretGroup = 2
keywords = ["ZOTERO_USER_ID", "zotero_user_id", "user_id"]

[[rules]]
id = "lmstudio-key"
description = "LM Studio API key assigned in env/config files"
regex = '''(?i)(LMSTUDIO_KEY|LMSTUDIO_API_KEY|lmstudio[_-]?(key|api[_-]?key))\s*[:=]\s*["']?([A-Za-z0-9._-]{16,})["']?'''
secretGroup = 3
keywords = ["LMSTUDIO_KEY", "LMSTUDIO_API_KEY", "lmstudio_key"]

[allowlist]
description = "Allow only explicit dummy credentials used by tests and examples"
regexes = [
  '''api_key="secret"''',
  '''api_key: str''',
  '''ZOTERO_API_KEY=''',
  '''ZOTERO_USER_ID=''',
  '''LMSTUDIO_KEY=''',
  '''user_id="123"''',
  '''user_id: str''',
]
